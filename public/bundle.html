<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Пакет файлов — FastWebFile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/tg-init.js"></script>
  <style>
    .bl-wrap {
      position: relative; z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }
    .bl-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--t3);
      text-decoration: none;
      margin-bottom: 20px;
      transition: color 0.15s;
    }
    .bl-back:hover { color: var(--t2); }
    .bl-back svg { width: 12px; height: 12px; }

    .bl-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .bl-icon {
      width: 44px; height: 44px;
      background: var(--c2);
      border: 1px solid var(--border-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
    }
    .bl-icon svg { width: 22px; height: 22px; }
    .bl-title { font-size: 18px; font-weight: 700; color: var(--t1); margin-bottom: 2px; }
    .bl-meta { font-size: 12px; color: var(--t3); font-family: var(--mono); }

    /* Expiry info bar */
    .bl-expiry {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      background: rgba(240,176,96,0.07);
      border: 1px solid rgba(240,176,96,0.18);
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--amber);
    }
    .bl-expiry svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* File rows */
    .bl-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: var(--c1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 6px;
      transition: border-color 0.15s;
    }
    .bl-file:hover { border-color: var(--border-light); }
    .bl-file-icon {
      flex-shrink: 0;
      width: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--t3);
    }
    .bl-file-icon svg { width: 18px; height: 18px; }
    .bl-file-info { flex: 1; min-width: 0; }
    .bl-file-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--t1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bl-file-size { font-size: 11px; color: var(--t3); font-family: var(--mono); margin-top: 2px; }
    .bl-dl-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      background: var(--c2);
      color: var(--t2);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }
    .bl-dl-btn svg { width: 12px; height: 12px; }
    .bl-dl-btn:hover { border-color: var(--accent-border); color: var(--accent); }

    .bl-file-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .bl-preview-btn {
      padding: 6px 9px;
      border: 1px solid var(--border-light);
      border-radius: 6px;
      background: var(--c2);
      color: var(--t3);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .bl-preview-btn:hover {
      border-color: var(--accent-border);
      color: var(--t1);
    }
    .bl-preview-btn svg { width: 12px; height: 12px; }

    /* Download all & ZIP footer */
    .bl-footer {
      margin-top: 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .bl-dl-zip {
      flex: 1.4;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 180px;
      text-decoration: none;
    }
    .bl-dl-zip:hover { opacity: 0.9; transform: translateY(-1px); }
    .bl-dl-zip:active { transform: translateY(0); }
    .bl-dl-zip svg { width: 15px; height: 15px; }

    .bl-dl-all {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      background: var(--c2);
      color: var(--t2);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 140px;
    }
    .bl-dl-all svg { width: 13px; height: 13px; }
    .bl-dl-all:hover { border-color: var(--accent-border); color: var(--t1); }
    .bl-dl-all:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Preview modal */
    .preview-overlay {
      position: fixed; inset: 0;
      background: rgba(10,10,18,0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; z-index: 120;
    }
    .preview-modal {
      background: var(--c1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      max-width: 580px;
      width: 100%;
      overflow: hidden;
      animation: slideIn 0.2s ease;
      display: flex;
      flex-direction: column;
      max-height: 85vh;
    }
    .preview-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .preview-title { font-size: 13px; font-weight: 600; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-close {
      background: none; border: none; cursor: pointer; color: var(--t3);
      padding: 4px; display: flex; border-radius: 4px; transition: color 0.15s;
    }
    .preview-close:hover { color: var(--t1); background: var(--c2); }
    .preview-close svg { width: 14px; height: 14px; }
    .preview-body { padding: 16px; overflow-y: auto; text-align: center; }
    .preview-body img { max-width: 100%; max-height: 400px; object-fit: contain; border-radius: var(--radius); }
    .preview-body video { width: 100%; max-height: 360px; border-radius: var(--radius); }
    .preview-body audio { width: 100%; }
    .preview-body pre {
      text-align: left; font-family: var(--mono); font-size: 11px; color: var(--t2);
      background: var(--c0); padding: 12px; border-radius: var(--radius); max-height: 360px;
      overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }

    /* Loading */
    .bl-loading { padding: 48px; text-align: center; color: var(--t3); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    .count-badge {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--t3);
      background: var(--c2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M8 3l5 5-5 5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <a href="/" style="text-decoration:none;color:inherit;" class="logo-name">Fast<span>Web</span>File</a>
      <span class="logo-tag">BUNDLE</span>
    </div>
    <div class="main-mode-nav-wrap">
      <nav class="main-mode-nav">
        <a href="/" class="mode-nav-btn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 3a1 1 0 011-1h4l2 2h4a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1V3z" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>Файлы</span>
        </a>
        <a href="/?drop=1" class="mode-nav-btn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 2L2 5.5v5l6 3.5 6-3.5v-5L8 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 5.5l6 3.5 6-3.5M8 9v5" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>Drop-папка (сбор)</span>
        </a>
        <a href="/p2p" class="mode-nav-btn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8.5 1.5L2.5 9h5.5l-1 5.5 6.5-8H8l.5-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span>P2P (50 ГБ+)</span>
        </a>
      </nav>
    </div>
    <div class="header-status">
      <a href="/" class="bl-back">
        <svg viewBox="0 0 12 12" fill="none"><path d="M8 1L3 6l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        На главную
      </a>
    </div>
  </div>
</header>

<div class="bl-wrap">
  <div id="loadingState" class="bl-loading"><span class="spinner"></span>Загрузка...</div>

  <div id="bundleState" hidden>
    <div class="bl-header">
      <div class="bl-icon">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 2L2 6v8l8 4 8-4V6L10 2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M2 6l8 4 8-4M10 10v10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6 4l8 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </div>
      <div>
        <p class="bl-title">Пакет файлов <span class="count-badge" id="blCount"></span> <span class="dl-pin-badge" id="blPinBadge" hidden></span></p>
        <p class="bl-meta" id="blMeta"></p>
      </div>
    </div>

    <div class="dl-sender-note" id="blSenderNote" hidden>
      <div class="dl-sender-note-title">
        <svg viewBox="0 0 16 16" fill="none"><path d="M3 3h10M3 7h10M3 11h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="2" y="1.5" width="12" height="13" rx="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
        Заметка от отправителя
      </div>
      <div class="dl-sender-note-text" id="blSenderNoteText"></div>
    </div>

    <div class="bl-expiry" id="blExpiry">
      <svg viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4.5V7l2 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span id="blExpiryText"></span>
    </div>

    <div id="blFileList"></div>

    <div class="bl-footer">
      <a class="bl-dl-zip" id="dlZipBtn" href="#">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 3h8v9a2 2 0 01-2 2H6a2 2 0 01-2-2V3z" stroke="currentColor" stroke-width="1.4"/><path d="M8 3v5M6 6h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Скачать всё одним .ZIP
      </a>
      <button class="bl-dl-all" id="dlAllBtn">
        <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v9M8 11l-3-3m3 3l3-3M3 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        По отдельности
      </button>
    </div>
  </div>
</div>

<!-- Preview Modal -->
<div class="preview-overlay" id="previewModal" hidden>
  <div class="preview-modal">
    <div class="preview-header">
      <span class="preview-title" id="modalPreviewTitle">Превью файла</span>
      <button type="button" class="preview-close" id="modalPreviewClose">
        <svg viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="preview-body" id="modalPreviewBody"></div>
  </div>
</div>

<!-- Password overlay -->
<div class="pwd-overlay" id="pwdOverlay" hidden>
  <div class="pwd-card">
    <div class="pwd-icon">
      <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>
    <p class="pwd-title">Пакет защищён паролем</p>
    <p class="pwd-sub">Введи пароль, чтобы получить доступ к файлам.</p>
    <div class="pwd-input-wrap">
      <input
        type="text"
        class="pwd-input"
        id="pwdInput"
        placeholder="Введи пароль..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        name="fwf_token_entry"
        data-lpignore="true"
        data-1p-ignore="true"
        data-form-type="other"
        autofocus
        style="-webkit-text-security:disc;text-security:disc"
      />
      <button type="button" class="pwd-toggle" id="pwdToggle">
        <svg viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
    <p class="pwd-error" id="pwdError"></p>
    <button class="pwd-btn" id="pwdSubmit">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Открыть
    </button>
  </div>
</div>

<style>
  /* Reuse pwd overlay styles from download page */
  .pwd-overlay { position:fixed;inset:0;background:rgba(10,10,18,0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100; }
  .pwd-overlay[hidden], [hidden] { display: none !important; }
  .pwd-card { background:var(--c1);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px 24px;max-width:360px;width:100%;text-align:center; }
  .pwd-icon { width:52px;height:52px;background:var(--c2);border:1px solid var(--border-light);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--accent); }
  .pwd-icon svg { width:24px;height:24px; }
  .pwd-title { font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px; }
  .pwd-sub { font-size:12px;color:var(--t3);margin-bottom:18px;line-height:1.5; }
  .pwd-input-wrap { position:relative;margin-bottom:10px; }
  .pwd-input { width:100%;padding:10px 38px 10px 12px;background:var(--c2);border:1px solid var(--border);border-radius:var(--radius);color:var(--t1);font-family:var(--mono);font-size:13px;outline:none;transition:border-color 0.15s;box-sizing:border-box; }
  .pwd-input:focus { border-color:var(--accent-border); }
  .pwd-input.error { border-color:var(--red,#f87171); }
  .pwd-toggle { position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--t3);padding:0;display:flex; }
  .pwd-toggle svg { width:14px;height:14px; }
  .pwd-error { font-size:11px;color:var(--red,#f87171);margin-bottom:10px;min-height:16px; }
  .pwd-btn { width:100%;padding:10px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.15s;display:flex;align-items:center;justify-content:center;gap:7px; }
  .pwd-btn:hover { opacity:0.85; }
  .pwd-btn:disabled { opacity:0.5;cursor:not-allowed; }
  .pwd-btn svg { width:14px;height:14px; }
</style>

<script>
  const bundleId = location.pathname.split('/').pop();

  function fmtSize(b) {
    if (b < 1024) return b + ' Б';
    if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' МБ';
    return (b/1073741824).toFixed(2) + ' ГБ';
  }
  function pluralFiles(n) {
    if (n % 10 === 1 && n % 100 !== 11) return 'файл';
    if ([2,3,4].includes(n%10) && ![12,13,14].includes(n%100)) return 'файла';
    return 'файлов';
  }
  function getFileIcon(name) {
    const ext = (name||'').split('.').pop().toLowerCase();
    const ICONS = {
      pdf:     `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 6h6M7 10h6M7 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      doc:     `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7h6M7 10.5h6M7 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      sheet:   `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 7h14M10 7v11" stroke="currentColor" stroke-width="1.4"/><path d="M7 11h3m4 0H10m0 4H7m6 0h-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`,
      slides:  `<svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M10 15v3M7 18h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      zip:     `<svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" stroke="currentColor" stroke-width="1.4"/><path d="M10 4v5M8 7h4M9 10h2v2h-2v2h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
      video:   `<svg viewBox="0 0 20 20" fill="none"><rect x="2" y="5" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M14 8l4-2v8l-4-2V8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
      audio:   `<svg viewBox="0 0 20 20" fill="none"><circle cx="5" cy="15" r="2.5" stroke="currentColor" stroke-width="1.4"/><circle cx="15" cy="13" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 15V7l10-2v8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      image:   `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 14l4-4 3 3 2-2 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      design:  `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M10 3v3M10 14v3M3 10h3M14 10h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`,
      code:    `<svg viewBox="0 0 20 20" fill="none"><path d="M6 8l-4 4 4 4M14 8l4 4-4 4M11 5l-2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      web:     `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M10 3c-2 2-3 4.5-3 7s1 5 3 7M10 3c2 2 3 4.5 3 7s-1 5-3 7M3 10h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
      exe:     `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M7 10h6M13 10l-2.5-2.5M13 10l-2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      text:    `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      file:    `<svg viewBox="0 0 20 20" fill="none"><path d="M5 2h7l4 4v12a1 1 0 01-1 1H5a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><path d="M12 2v4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    };
    const EXT_MAP = {
      pdf:'pdf', doc:'doc', docx:'doc', odt:'doc',
      xls:'sheet', xlsx:'sheet', csv:'sheet',
      ppt:'slides', pptx:'slides',
      zip:'zip', rar:'zip', '7z':'zip', gz:'zip', tar:'zip',
      mp4:'video', mov:'video', avi:'video', mkv:'video', webm:'video',
      mp3:'audio', wav:'audio', flac:'audio', ogg:'audio', aac:'audio',
      png:'image', jpg:'image', jpeg:'image', gif:'image', webp:'image', bmp:'image',
      svg:'design', fig:'design', psd:'design', ai:'design',
      js:'code', ts:'code', jsx:'code', tsx:'code', json:'code', css:'code', scss:'code',
      html:'web', py:'code', exe:'exe', msi:'exe', dmg:'file', iso:'file',
      txt:'text', md:'text', log:'text', xml:'text',
    };
    return ICONS[EXT_MAP[ext] || 'file'];
  }
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function expiryText(b) {
    if (b.expiry === 'once') return 'Удалится после скачивания каждого файла';
    if (b.expiry === '1day') {
      if (b.expiresAt) {
        const h = Math.ceil((b.expiresAt - Date.now()) / 3600000);
        return `Истекает через ~${h} ч`;
      }
      return 'Хранится 1 день';
    }
    if (b.expiry === '3days') {
      if (b.expiresAt) {
        const h = Math.ceil((b.expiresAt - Date.now()) / 3600000);
        return h > 24 ? `Истекает через ~${Math.ceil(h/24)} дн.` : `Истекает через ~${h} ч`;
      }
      return 'Хранится 3 дня';
    }
    return '';
  }

  let enteredPwd = '';

  fetch(`/api/bundle/${bundleId}`).then(r => {
    if (!r.ok) { location.href = '/expired.html'; return null; }
    return r.json();
  }).then(bundle => {
    if (!bundle) return;
    document.getElementById('loadingState').style.display = 'none';

    if (bundle.hasPassword) {
      document.getElementById('pwdOverlay').removeAttribute('hidden');
      setupPasswordOverlay(bundle);
    } else {
      showBundle(bundle);
    }
  }).catch(() => location.href = '/expired.html');

  function setupPasswordOverlay(bundle) {
    const pwdInput  = document.getElementById('pwdInput');
    const pwdSubmit = document.getElementById('pwdSubmit');
    const pwdError  = document.getElementById('pwdError');
    const pwdToggle = document.getElementById('pwdToggle');

    pwdToggle.addEventListener('click', () => {
      const isText = pwdInput.type === 'text';
      pwdInput.type = isText ? 'password' : 'text';
      pwdToggle.querySelector('svg').innerHTML = isText
        ? `<ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/>`
        : `<path d="M1 1l14 14M6.5 6.6A2 2 0 0010 9.4M3.5 3.8A6 6 0 001.5 8c1.2 2.3 3.7 4 6.5 4a6.5 6.5 0 003.3-.9M6 4.1A6.5 6.5 0 0114.5 8a6.3 6.3 0 01-1.6 2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>`;
    });

    async function tryPassword() {
      const pwd = pwdInput.value.trim();
      if (!pwd) { pwdError.textContent = 'Введи пароль'; return; }
      pwdSubmit.disabled = true;
      pwdError.textContent = '';
      const r = await fetch(`/api/verify-password/${bundleId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      const { ok } = await r.json();
      if (ok) {
        enteredPwd = pwd;
        if (typeof SoundFX !== 'undefined') SoundFX.success();
        document.getElementById('pwdOverlay').setAttribute('hidden', '');
        showBundle(bundle);
      } else {
        pwdInput.classList.add('error');
        pwdError.textContent = 'Неверный пароль';
        pwdSubmit.disabled = false;
        pwdInput.select();
        if (typeof SoundFX !== 'undefined') SoundFX.error();
        pwdInput.parentElement.classList.add('shake');
        setTimeout(() => pwdInput.parentElement.classList.remove('shake'), 400);
      }
    }
    pwdSubmit.addEventListener('click', tryPassword);
    pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryPassword(); });
    pwdInput.addEventListener('input', () => { pwdInput.classList.remove('error'); pwdError.textContent = ''; });
  }

  // ── Preview modal helpers ───────────────────────────────────────────────────
  const previewModal = document.getElementById('previewModal');
  const modalPreviewTitle = document.getElementById('modalPreviewTitle');
  const modalPreviewBody = document.getElementById('modalPreviewBody');
  document.getElementById('modalPreviewClose').addEventListener('click', () => {
    previewModal.setAttribute('hidden', '');
    modalPreviewBody.innerHTML = '';
  });
  previewModal.addEventListener('click', e => {
    if (e.target === previewModal) {
      previewModal.setAttribute('hidden', '');
      modalPreviewBody.innerHTML = '';
    }
  });

  function openFilePreview(file) {
    const ext = (file.originalName || '').split('.').pop().toLowerCase();
    const viewUrl = `/api/view/${file.id}` + (enteredPwd ? `?pwd=${encodeURIComponent(enteredPwd)}` : '');
    modalPreviewTitle.textContent = file.originalName;
    modalPreviewBody.innerHTML = '<span class="spinner"></span> Загрузка превью...';
    previewModal.removeAttribute('hidden');

    const imgExts = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'];
    const audioExts = ['mp3', 'wav', 'ogg', 'flac', 'aac'];
    const videoExts = ['mp4', 'webm', 'mov'];
    const textExts = ['txt', 'md', 'json', 'js', 'ts', 'jsx', 'tsx', 'py', 'html', 'css', 'scss', 'xml', 'log', 'sh', 'sql', 'yaml', 'yml'];

    if (imgExts.includes(ext)) {
      modalPreviewBody.innerHTML = `<img src="${viewUrl}" alt="Превью" />`;
    } else if (ext === 'pdf') {
      modalPreviewBody.innerHTML = `<iframe class="dl-preview-pdf" src="${viewUrl}" title="PDF Preview" style="width:100%;height:460px;border:none;border-radius:8px;background:#fff;"></iframe>`;
    } else if (audioExts.includes(ext)) {
      modalPreviewBody.innerHTML = `<audio controls autoplay src="${viewUrl}"></audio>`;
    } else if (videoExts.includes(ext)) {
      modalPreviewBody.innerHTML = `<video controls autoplay src="${viewUrl}"></video>`;
    } else if (textExts.includes(ext)) {
      fetch(viewUrl).then(r => r.text()).then(txt => {
        modalPreviewBody.innerHTML = `<pre>${esc(txt.slice(0, 15000))}${txt.length > 15000 ? '\n\n... (показана часть файла)' : ''}</pre>`;
      }).catch(() => {
        modalPreviewBody.innerHTML = '<p style="color:var(--t3)">Не удалось загрузить текст</p>';
      });
    } else {
      modalPreviewBody.innerHTML = `<p style="color:var(--t3);margin-bottom:12px;">Прямой предпросмотр недоступен для этого формата</p><a class="bl-dl-btn" style="display:inline-flex;" href="${viewUrl}" target="_blank">Открыть файл</a>`;
    }
  }

  function isPreviewable(filename) {
    const ext = (filename || '').split('.').pop().toLowerCase();
    return ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'pdf', 'mp3', 'wav', 'ogg', 'flac', 'aac', 'mp4', 'webm', 'mov', 'txt', 'md', 'json', 'js', 'ts', 'py', 'html', 'css', 'xml', 'log'].includes(ext);
  }

  function showBundle(bundle) {
    const total = bundle.files.reduce((s, f) => s + f.size, 0);
    document.getElementById('blCount').textContent = bundle.files.length + ' ' + pluralFiles(bundle.files.length);
    document.getElementById('blMeta').textContent =
      `Общий размер: ${fmtSize(total)} · ID: ${bundleId}`;
    document.getElementById('blExpiryText').textContent = expiryText(bundle);

    if (bundle.pin) {
      const pinEl = document.getElementById('blPinBadge');
      pinEl.textContent = `PIN: ${bundle.pin}`;
      pinEl.removeAttribute('hidden');
    }

    if (bundle.description) {
      const noteEl = document.getElementById('blSenderNote');
      document.getElementById('blSenderNoteText').textContent = bundle.description;
      noteEl.removeAttribute('hidden');
    }

    // ZIP download link
    const zipBtn = document.getElementById('dlZipBtn');
    zipBtn.href = `/api/bundle/${bundle.id}/zip` + (enteredPwd ? `?pwd=${encodeURIComponent(enteredPwd)}` : '');
    zipBtn.download = `bundle-${bundle.id}.zip`;

    const list = document.getElementById('blFileList');
    list.innerHTML = '';
    bundle.files.forEach(f => {
      const row = document.createElement('div');
      row.className = 'bl-file';
      const dlUrl = `/api/download/${f.id}` + (enteredPwd ? `?pwd=${encodeURIComponent(enteredPwd)}` : '');
      const canPreview = isPreviewable(f.originalName);

      row.innerHTML = `
        <div class="bl-file-icon">${getFileIcon(f.originalName)}</div>
        <div class="bl-file-info">
          <div class="bl-file-name" title="${esc(f.originalName)}">${esc(f.originalName)}</div>
          <div class="bl-file-size">${fmtSize(f.size)}</div>
        </div>
        <div class="bl-file-actions">
          ${canPreview ? `
          <button type="button" class="bl-preview-btn" data-fid="${f.id}" title="Предпросмотр">
            <svg viewBox="0 0 16 16" fill="none"><ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/></svg>
            Просмотр
          </button>` : ''}
          <a class="bl-dl-btn" href="${dlUrl}" download title="Скачать">
            <svg viewBox="0 0 12 12" fill="none"><path d="M6 1v7M6 8L3.5 5.5M6 8l2.5-2.5M2 11h8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Скачать
          </a>
        </div>`;
      list.appendChild(row);

      if (canPreview) {
        row.querySelector('.bl-preview-btn').addEventListener('click', () => openFilePreview(f));
      }
    });

    // Download all — sequential with delay
    document.getElementById('dlAllBtn').addEventListener('click', async function() {
      this.disabled = true;
      this.innerHTML = '<span class="spinner"></span>Скачивание...';
      for (let i = 0; i < bundle.files.length; i++) {
        const f = bundle.files[i];
        const a = document.createElement('a');
        a.href = `/api/download/${f.id}` + (enteredPwd ? `?pwd=${encodeURIComponent(enteredPwd)}` : '');
        a.download = '';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        if (i < bundle.files.length - 1) await sleep(600);
      }
      setTimeout(() => {
        this.disabled = false;
        this.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M8 2v9M8 11l-3-3m3 3l3-3M3 14h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>По отдельности';
      }, 2000);
    });

    document.getElementById('bundleState').removeAttribute('hidden');
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
</script>
</body>
