<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Скачать файл — FastWebFile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    .dl-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .dl-card {
      background: var(--c1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .dl-card-top {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .dl-site {
      font-size: 12px;
      font-weight: 600;
      color: var(--t3);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dl-site-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }
    .dl-file-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--c2);
      border: 1px solid var(--border-light);
      border-radius: 16px;
      color: var(--accent);
    }
    .dl-file-icon svg { width: 32px; height: 32px; }
    .dl-filename {
      font-size: 15px;
      font-weight: 600;
      color: var(--t1);
      margin-bottom: 6px;
      word-break: break-all;
    }
    .dl-meta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .dl-meta-item {
      font-size: 12px;
      color: var(--t3);
      font-family: var(--mono);
    }
    .dl-card-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
    .dl-warn {
      padding: 10px 12px;
      background: rgba(240,176,96,0.08);
      border: 1px solid rgba(240,176,96,0.2);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--amber);
      display: flex;
      gap: 8px;
      align-items: flex-start;
      line-height: 1.5;
    }
    .dl-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .dl-btn svg { width: 16px; height: 16px; }
    .dl-btn:hover { opacity: 0.85; }
    .dl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Preview box */
    .dl-preview-area {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--c2);
      overflow: hidden;
      margin-bottom: 4px;
    }
    .dl-preview-img {
      display: block;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      background: #08080c;
    }
    .dl-preview-video {
      display: block;
      width: 100%;
      max-height: 260px;
      background: #000;
      border-radius: var(--radius);
    }
    .dl-preview-audio {
      padding: 10px;
      background: var(--c2);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dl-preview-audio audio {
      width: 100%;
      height: 36px;
    }
    .dl-preview-code {
      max-height: 220px;
      overflow-y: auto;
      padding: 12px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.5;
      color: var(--t2);
      white-space: pre-wrap;
      word-break: break-all;
      background: var(--c0);
      user-select: text;
    }
    .dl-preview-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--t3);
      font-family: var(--mono);
      padding: 3px 8px;
      background: var(--c3);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .dl-back, a.dl-back, a.dl-back:visited {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--t3);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: var(--radius);
      transition: all 0.15s ease;
      margin-top: 4px;
      width: 100%;
      box-sizing: border-box;
    }
    .dl-back:hover, a.dl-back:hover {
      color: var(--t1);
      background: var(--c2);
      text-decoration: none;
    }
    .dl-back svg {
      width: 12px;
      height: 12px;
    }
    .dl-loading { text-align: center; padding: 40px; color: var(--t3); font-size: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* Password overlay */
    .pwd-overlay {
      position: fixed; inset: 0;
      background: rgba(10,10,18,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    .pwd-overlay[hidden], [hidden] {
      display: none !important;
    }
    .pwd-card {
      background: var(--c1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
    }
    .pwd-icon {
      width: 52px; height: 52px;
      background: var(--c2);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      color: var(--accent);
    }
    .pwd-icon svg { width: 24px; height: 24px; }
    .pwd-title { font-size: 16px; font-weight: 700; color: var(--t1); margin-bottom: 6px; }
    .pwd-sub { font-size: 12px; color: var(--t3); margin-bottom: 18px; line-height: 1.5; }
    .pwd-input-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .pwd-input {
      width: 100%;
      padding: 10px 38px 10px 12px;
      background: var(--c2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--t1);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
      box-sizing: border-box;
    }
    .pwd-input:focus { border-color: var(--accent-border); }
    .pwd-input.error { border-color: var(--red); }
    .pwd-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--t3);
      padding: 0; display: flex;
    }
    .pwd-toggle svg { width: 14px; height: 14px; }
    .pwd-error { font-size: 11px; color: var(--red, #f87171); margin-bottom: 10px; min-height: 16px; }
    .pwd-btn {
      width: 100%; padding: 10px;
      border: none; border-radius: var(--radius);
      background: var(--accent); color: #fff;
      font-family: var(--font); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 7px;
    }
    .pwd-btn:hover { opacity: 0.85; }
    .pwd-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pwd-btn svg { width: 14px; height: 14px; }
  </style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M3 8h10M8 3l5 5-5 5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <a href="/" style="text-decoration:none;color:inherit;" class="logo-name">Fast<span>Web</span>File</a>
      <span class="logo-tag">FILE</span>
    </div>
    <div class="main-mode-nav-wrap">
      <nav class="main-mode-nav">
        <a href="/" class="mode-nav-btn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 3a1 1 0 011-1h4l2 2h4a1 1 0 011 1v7a1 1 0 01-1 1H3a1 1 0 01-1-1V3z" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>Файлы</span>
        </a>
        <a href="/?drop=1" class="mode-nav-btn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 2L2 5.5v5l6 3.5 6-3.5v-5L8 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 5.5l6 3.5 6-3.5M8 9v5" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>Drop-папка (сбор)</span>
        </a>
        <a href="/p2p" class="mode-nav-btn">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8.5 1.5L2.5 9h5.5l-1 5.5 6.5-8H8l.5-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span>P2P (50 ГБ+)</span>
        </a>
      </nav>
    </div>
    <div class="header-status">
      <a href="/" class="bl-back">
        <svg viewBox="0 0 12 12" fill="none"><path d="M8 1L3 6l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        На главную
      </a>
    </div>
  </div>
</header>

<div class="dl-wrap">
  <div class="dl-card">
    <div id="loadingState" class="dl-loading">
      <span class="spinner"></span>Загрузка...
    </div>
    <div id="fileState" hidden>
      <div class="dl-card-top">
        <p class="dl-site"><span class="dl-site-dot"></span>FastWebFile</p>
        <div class="dl-file-icon" id="dlIcon"></div>
        <p class="dl-filename" id="dlFilename"></p>
        <div class="dl-meta-row">
          <span class="dl-meta-item" id="dlSize"></span>
          <span class="dl-meta-item">·</span>
          <span class="dl-meta-item" id="dlExpiry"></span>
          <span class="dl-pin-badge" id="dlPinBadge" hidden></span>
        </div>
      </div>
      <div class="dl-card-body">
        <div class="dl-sender-note" id="dlSenderNote" hidden>
          <div class="dl-sender-note-title">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 3h10M3 7h10M3 11h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="2" y="1.5" width="12" height="13" rx="1.5" stroke="currentColor" stroke-width="1.2"/></svg>
            Заметка от отправителя
          </div>
          <div class="dl-sender-note-text" id="dlSenderNoteText"></div>
        </div>
        <div id="dlPreviewArea" class="dl-preview-area" hidden></div>
        <div class="dl-warn" id="dlWarn" hidden>
          <span>
            <svg viewBox="0 0 16 16" fill="none" style="width:14px;height:14px;flex-shrink:0;margin-top:1px"><path d="M8 2L1.5 13.5h13L8 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 7v3M8 12v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </span>
          <span id="dlWarnText"></span>
        </div>
        <button class="dl-btn" id="dlBtn">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M10 3v10M10 13l-4-4m4 4l4-4M4 17h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Скачать файл
        </button>
        <a href="/" class="dl-back">
          <svg viewBox="0 0 12 12" fill="none"><path d="M8 1L3 6l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Загрузить свой файл
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Password overlay (hidden by default) -->
<div class="pwd-overlay" id="pwdOverlay" hidden>
  <div class="pwd-card">
    <div class="pwd-icon">
      <svg viewBox="0 0 16 16" fill="none"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </div>
    <p class="pwd-title">Файл защищён паролем</p>
    <p class="pwd-sub">Введи пароль, чтобы получить доступ к файлу.</p>
    <div class="pwd-input-wrap">
      <input
        type="text"
        class="pwd-input"
        id="pwdInput"
        placeholder="Введи пароль..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        name="fwf_token_entry"
        data-lpignore="true"
        data-1p-ignore="true"
        data-form-type="other"
        autofocus
        style="-webkit-text-security:disc;text-security:disc"
      />
      <button type="button" class="pwd-toggle" id="pwdToggle">
        <svg viewBox="0 0 16 16" fill="none" id="pwdEye"><ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
    <p class="pwd-error" id="pwdError"></p>
    <button class="pwd-btn" id="pwdSubmit">
      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M8 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Открыть
    </button>
  </div>
</div>

<script>
  const id = location.pathname.split('/').pop();
  let enteredPwd = '';

  function fmtSize(b) {
    if (b < 1024) return b + ' Б';
    if (b < 1048576) return (b/1024).toFixed(1) + ' КБ';
    if (b < 1073741824) return (b/1048576).toFixed(1) + ' МБ';
    return (b/1073741824).toFixed(2) + ' ГБ';
  }
  function getFileIcon(name) {
    const ext = (name||'').split('.').pop().toLowerCase();
    const ICONS = {
      pdf:     `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 6h6M7 10h6M7 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      doc:     `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7h6M7 10.5h6M7 14h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      sheet:   `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M3 7h14M10 7v11" stroke="currentColor" stroke-width="1.4"/><path d="M7 11h3m4 0H10m0 4H7m6 0h-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`,
      slides:  `<svg viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M10 15v3M7 18h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      zip:     `<svg viewBox="0 0 20 20" fill="none"><path d="M4 4h12v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" stroke="currentColor" stroke-width="1.4"/><path d="M10 4v5M8 7h4M9 10h2v2h-2v2h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
      video:   `<svg viewBox="0 0 20 20" fill="none"><rect x="2" y="5" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M14 8l4-2v8l-4-2V8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
      audio:   `<svg viewBox="0 0 20 20" fill="none"><circle cx="5" cy="15" r="2.5" stroke="currentColor" stroke-width="1.4"/><circle cx="15" cy="13" r="2.5" stroke="currentColor" stroke-width="1.4"/><path d="M7.5 15V7l10-2v8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      image:   `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="7.5" cy="7.5" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3 14l4-4 3 3 2-2 5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      design:  `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M10 3v3M10 14v3M3 10h3M14 10h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>`,
      code:    `<svg viewBox="0 0 20 20" fill="none"><path d="M6 8l-4 4 4 4M14 8l4 4-4 4M11 5l-2 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      web:     `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M10 3c-2 2-3 4.5-3 7s1 5 3 7M10 3c2 2 3 4.5 3 7s-1 5-3 7M3 10h14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
      exe:     `<svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M7 10h6M13 10l-2.5-2.5M13 10l-2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      text:    `<svg viewBox="0 0 20 20" fill="none"><rect x="3" y="2" width="14" height="16" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 7h6M7 10h6M7 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      file:    `<svg viewBox="0 0 20 20" fill="none"><path d="M5 2h7l4 4v12a1 1 0 01-1 1H5a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.4"/><path d="M12 2v4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    };
    const EXT_MAP = {
      pdf:'pdf', doc:'doc', docx:'doc', odt:'doc',
      xls:'sheet', xlsx:'sheet', csv:'sheet',
      ppt:'slides', pptx:'slides',
      zip:'zip', rar:'zip', '7z':'zip', gz:'zip', tar:'zip',
      mp4:'video', mov:'video', avi:'video', mkv:'video', webm:'video',
      mp3:'audio', wav:'audio', flac:'audio', ogg:'audio', aac:'audio',
      png:'image', jpg:'image', jpeg:'image', gif:'image', webp:'image', bmp:'image',
      svg:'design', fig:'design', psd:'design', ai:'design',
      js:'code', ts:'code', jsx:'code', tsx:'code', json:'code', css:'code', scss:'code',
      html:'web', py:'code', exe:'exe', msi:'exe', dmg:'file', iso:'file',
      txt:'text', md:'text', log:'text', xml:'text',
    };
    return ICONS[EXT_MAP[ext] || 'file'];
  }
  function expiryLabel(e) {
    return {once:'Одно скачивание','1day':'1 день','3days':'3 дня'}[e] || e;
  }

  // ── Load file info ──────────────────────────────────────────────────────────
  fetch(`/api/file/${id}`).then(r => {
    if (!r.ok) { location.href='/expired.html'; return; }
    return r.json();
  }).then(f => {
    if (!f) return;
    document.getElementById('loadingState').style.display = 'none';

    if (f.hasPassword) {
      // Show password overlay
      document.getElementById('pwdOverlay').removeAttribute('hidden');
      setupPasswordOverlay(f);
    } else {
      showFileCard(f);
    }
  }).catch(() => { location.href='/expired.html'; });

  function renderPreview(f) {
    const ext = (f.originalName || '').split('.').pop().toLowerCase();
    const previewEl = document.getElementById('dlPreviewArea');
    const viewUrl = `/api/view/${id}` + (enteredPwd ? `?pwd=${encodeURIComponent(enteredPwd)}` : '');

    const imgExts = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp'];
    const audioExts = ['mp3', 'wav', 'ogg', 'flac', 'aac'];
    const videoExts = ['mp4', 'webm', 'mov'];
    const textExts = ['txt', 'md', 'json', 'js', 'ts', 'jsx', 'tsx', 'py', 'html', 'css', 'scss', 'xml', 'log', 'sh', 'sql', 'yaml', 'yml'];

    if (imgExts.includes(ext)) {
      previewEl.innerHTML = `<img src="${viewUrl}" class="dl-preview-img" alt="Превью" loading="lazy" />`;
      previewEl.removeAttribute('hidden');
    } else if (ext === 'pdf') {
      previewEl.innerHTML = `<div class="dl-preview-badge">📑 Предпросмотр PDF</div><iframe class="dl-preview-pdf" src="${viewUrl}" title="PDF Preview"></iframe>`;
      previewEl.removeAttribute('hidden');
    } else if (audioExts.includes(ext)) {
      previewEl.innerHTML = `<div class="dl-preview-audio"><audio controls src="${viewUrl}" preload="metadata"></audio></div>`;
      previewEl.removeAttribute('hidden');
    } else if (videoExts.includes(ext)) {
      previewEl.innerHTML = `<video controls class="dl-preview-video" src="${viewUrl}" preload="metadata"></video>`;
      previewEl.removeAttribute('hidden');
    } else if (textExts.includes(ext) && f.size < 500 * 1024) { // max 500kb text preview
      previewEl.innerHTML = `<div class="dl-preview-badge">📄 Предпросмотр текста (${ext.toUpperCase()})</div><pre class="dl-preview-code">Загрузка текста...</pre>`;
      previewEl.removeAttribute('hidden');
      fetch(viewUrl).then(r => r.text()).then(txt => {
        const codeEl = previewEl.querySelector('pre');
        if (codeEl) codeEl.textContent = txt.slice(0, 10000) + (txt.length > 10000 ? '\n\n... (показана часть файла)' : '');
      }).catch(() => {});
    }
  }

  function showFileCard(f) {
    document.getElementById('dlIcon').innerHTML = getFileIcon(f.originalName);
    document.getElementById('dlFilename').textContent = f.originalName;
    document.getElementById('dlSize').textContent = fmtSize(f.size);
    document.getElementById('dlExpiry').textContent = expiryLabel(f.expiry);

    if (f.pin) {
      const pinEl = document.getElementById('dlPinBadge');
      pinEl.textContent = `PIN: ${f.pin}`;
      pinEl.removeAttribute('hidden');
    }

    if (f.description) {
      const noteEl = document.getElementById('dlSenderNote');
      document.getElementById('dlSenderNoteText').textContent = f.description;
      noteEl.removeAttribute('hidden');
    }

    if (f.expiry === 'once') {
      document.getElementById('dlWarn').removeAttribute('hidden');
      document.getElementById('dlWarnText').textContent = 'Файл будет удалён сразу после скачивания.';
    } else if (f.expiresAt) {
      const mins = Math.floor((f.expiresAt - Date.now()) / 60000);
      if (mins < 60) {
        document.getElementById('dlWarn').removeAttribute('hidden');
        document.getElementById('dlWarnText').textContent = `Файл истекает через ${mins} мин.`;
      }
    }
    renderPreview(f);
    document.getElementById('fileState').removeAttribute('hidden');
  }

  function setupPasswordOverlay(f) {
    const pwdInput  = document.getElementById('pwdInput');
    const pwdSubmit = document.getElementById('pwdSubmit');
    const pwdError  = document.getElementById('pwdError');
    const pwdToggle = document.getElementById('pwdToggle');

    // Show/hide password
    pwdToggle.addEventListener('click', () => {
      const isHidden = pwdInput.style.webkitTextSecurity !== 'none';
      pwdInput.style.webkitTextSecurity = isHidden ? 'none' : 'disc';
      pwdInput.style.textSecurity = isHidden ? 'none' : 'disc';
      pwdToggle.querySelector('svg').innerHTML = isHidden
        ? `<path d="M1 1l14 14M6.5 6.6A2 2 0 0010 9.4M3.5 3.8A6 6 0 001.5 8c1.2 2.3 3.7 4 6.5 4a6.5 6.5 0 003.3-.9M6 4.1A6.5 6.5 0 0114.5 8a6.3 6.3 0 01-1.6 2.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>`
        : `<ellipse cx="8" cy="8" rx="6" ry="4" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/>`;
    });

    async function tryPassword() {
      const pwd = pwdInput.value.trim();
      if (!pwd) { pwdError.textContent = 'Введи пароль'; return; }
      pwdSubmit.disabled = true;
      pwdError.textContent = '';
      const r = await fetch(`/api/verify-password/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      const { ok } = await r.json();
      if (ok) {
        enteredPwd = pwd;
        document.getElementById('pwdOverlay').setAttribute('hidden', '');
        showFileCard(f);
      } else {
        pwdInput.classList.add('error');
        pwdError.textContent = 'Неверный пароль';
        pwdSubmit.disabled = false;
        pwdInput.select();
        pwdInput.parentElement.classList.add('shake');
        setTimeout(() => pwdInput.parentElement.classList.remove('shake'), 400);
      }
    }

    pwdSubmit.addEventListener('click', tryPassword);
    pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryPassword(); });
    pwdInput.addEventListener('input', () => { pwdInput.classList.remove('error'); pwdError.textContent = ''; });
  }

  // ── Download button ─────────────────────────────────────────────────────────
  document.getElementById('dlBtn').addEventListener('click', function() {
    this.disabled = true;
    this.innerHTML = '<span class="spinner"></span> Скачивание...';
    const a = document.createElement('a');
    a.href = `/api/download/${id}` + (enteredPwd ? `?pwd=${encodeURIComponent(enteredPwd)}` : '');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => {
      this.disabled = false;
      this.innerHTML = '<svg viewBox="0 0 20 20" fill="none"><path d="M10 3v10M10 13l-4-4m4 4l4-4M4 17h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Скачать снова';
    }, 3000);
  });
</script>
</body>
